# Global settings. Mode files (config/modes/<mode>.yaml) are deep-merged on top.
# Regulatory/fee constants do NOT live here — see config/rules/ (effective-dated).
#
# Base risk numbers, sleeve rules, and disconnect semantics below were APPROVED by the
# owner on 11 Nov 2026; changing them later requires the owner's explicit OK (CLAUDE.md).

timezone: Asia/Kolkata

# Engine Version Architecture:
# - v1_shadow: "Shadow Order Book" Scanner (Human-in-the-Loop radar + auto SL/T1/T2 + Shadow Ledger, zero live order placement)
# - v2_bot:    Automated Execution Bot Engine (routes Confluence & Strategy signals to PaperBroker or gated LiveBroker)
engine_version: v1_shadow

capital:
  # APPROVED (owner, 11 Nov 2026): Shared ₹2L account pool governed by 50% margin headroom
  # (≤ ₹1L margin used) and 10% max open risk (≤ ₹20k), with up to ₹1L allocatable to Event-Arb
  # when no F&O spread is consuming that margin. Individual stock F&O and pre-earnings straddles
  # (§5.5) are deferred at ₹2L capital.
  inr: 200000            # APPROVED: ₹2L (SPEC range ₹1–2L)

shadow_scanner:          # Version 1 ("Shadow Order Book") & Order-Flow Confluence parameters
  # STATUS: HYPOTHESIS (owner decision 11 Nov 2026). The score, RER, OBI, air-pocket, CVD and
  # stop-pool thresholds below are unvalidated priors. They stay unproven until 20-30 recorded
  # sessions give out-of-sample results with t ~ 3 and a deflated Sharpe; every variant tried
  # counts as a trial. Do not trade on them.
  # The Kelly sizing lines (kelly_*) are APPROVED risk guards (owner, 11 Nov 2026).
  max_watchlist_symbols: 50       # Upstox V3 full_d30 30-level depth limit per connection
  depth_levels: 30                # L1-L30 market depth levels
  min_confidence_score: 75.0      # Minimum 0-100 composite score to emit a Shadow Signal
  a_plus_confidence_score: 80.0   # High-conviction A+ alert threshold
  signal_confirm_s: 5             # HYPOTHESIS: grade must hold this many seconds (same direction)
                                  # before Track A tracks it, the bot takes it or it is alerted
  watchlist_score: 65.0           # Pre-alert radar threshold
  rer_confirm_min: 0.75           # Real Execution Ratio > 0.75 confirms genuine absorption/breakout
  rer_spoof_max: 0.20             # Real Execution Ratio < 0.20 blocks trade as spoof/pull
  obi_confirm_min: 0.50           # Exp-weighted L1-L5 OBI threshold for directional pressure
  air_pocket_ratio_max: 0.55      # L6-L25 vs L1-L5 ratio < 0.55 indicates thin-book liquidity vacuum
  cvd_z_confirm_min: 2.0          # Rolling Cumulative Volume Delta Z-score threshold
  order_persistence_ms: 500       # Minimum Resting Wall Age (ms) before trusting as structural wall
  stop_pool_band_min_pct: 0.15    # Stop-hunt sweep zone lower bound (%)
  stop_pool_band_max_pct: 0.40    # Stop-hunt sweep zone upper bound (%)
  sl_tick_buffer: 2               # Ticks behind structural wall / sweep extreme for SL
  option_min_premium: 5           # options below this mid are not scored (HYPOTHESIS)
  option_min_premium_by_underlying: {SENSEX: 15}   # fix.md: Sensex 15, Nifty 5
  option_max_spread_pct: 5        # ...nor with a spread wider than this % of mid
  option_min_ask: 0.25            # ...nor at the tick floor
  min_location_pts: 8             # without a structural level the score is capped...
  location_gate_cap: 60           # ...here (below the 65 watchlist line)
  book_disagreement_factor: 0.5   # book pillar x0.5 when touch and top-5 imbalance disagree
  spoof_event_s: 30               # a pulled/eaten wall sets the pattern for this long
  spoof_location_pts: 15          # ...and counts as this much structural location
  min_rr_t1: 1.5                  # Minimum Risk:Reward for Target 1
  min_rr_t2: 2.5                  # Minimum Risk:Reward for Target 2
  kelly_fraction: 0.25            # Quarter-Kelly multiplier
  kelly_max_risk_pct: 1.5         # Clamped max risk per trade (%) for dynamic Kelly
  kelly_rolling_window: 100       # Rolling Shadow/Bot trade window for empirical Kelly
  # Paper ledger (forward test of 75+ signals). No new paper entries after this time; anything
  # still open is closed at the touch at square-off (or when the session ends earlier).
  paper_no_new_entries_after: "15:00"
  paper_square_off_at: "15:20"
  cost_broker: upstox_plus        # brokerage plan the costs assume (rows in rules/brokerage.csv)
  report_dir: reports/shadow_scanner
  ledger_file: data/state/shadow_ledger.jsonl

cockpit:                 # Local live page (engine/cockpit): uv run python tasks.py cockpit
  # Loopback only. The engine (shadow-live) publishes on engine_port; the gateway serves the
  # page on gateway_port and relays; replays publish on replay_port. Never places live orders.
  enabled: true
  host: 127.0.0.1
  gateway_port: 8765
  engine_port: 8766
  replay_port: 8767
  publish_interval_ms: 200        # snapshot push rate (5 a second); sooner after a fill
  analytics_interval_s: 1         # forward / ATM IV / IV percentile from in-memory books
  chain_interval_s: 60            # OI walls, PCR, GEX from the recorder's 1-minute snapshots
  bot:                            # score-follow test: original A+ bot, on its own "score" account
    enabled: true                 # owner, 12 Nov (evening): keep testing it as one strategy of many
    min_score: 80                 # takes A+ signals only
    option_stop_pct: 25           # HYPOTHESIS, paper only: stop on premium so the risk gate
                                  # can size the trade (a stop-less long option risks all premium)
  directional:                    # SPEC 5.2 on the Bot account; order flow confirms entries
    enabled: true                 # HYPOTHESIS rules from the Log-3 study; paper only
    min_score: 80                 # confirmed (5-s hold) order-flow reading on the index or its options
    first_entry: "09:30"
    last_entry: "14:00"           # SPEC: no entries after 14:00 (late trades lost)
    max_entries_per_day: 2        # one idea; one same-direction re-entry after a stop
    stop_pct: 10                  # premium stop (SPEC: about -10%)
    target_pct: 30                # premium target (SPEC: about +30%)
    trail: [[15, 7], [25, 12]]    # at +15% lock +7%; at +25% lock +12%
    underlyings: [NIFTY, SENSEX]
  setups:                         # order-flow readings -> confirmed setups (HYPOTHESIS)
    confirm_move_pct: 0.05        # index must follow through this far (Nifty ~13 pts)...
    hold_s: 60                    # ...and stay past it this long
    window_min: 10                # or the setup fails
    fail_move_pct: 0.08           # fails if the index moves this far against it first
    valid_min: 60                 # a confirmed setup counts for this long
  condor:                         # SPEC 5.1 on paper; order flow is the veto (HYPOTHESIS)
    enabled: true
    underlying: NIFTY
    first_entry: "10:00"
    last_entry: "14:30"
    min_days_to_expiry: 2         # calendar days to the weekly expiry
    short_delta: 0.16             # SPEC: ~15-20 delta
    wing_widths: [200, 150, 100]  # widest whose worst case fits risk.per_trade_max_loss_pct
    min_credit_pct_of_width: 10
    min_iv_percentile: 50         # SPEC: IV percentile > 50
    veto_lookback_min: 30         # confirmed setups in this window: one side only or none
    one_sided_on_trend: true      # UP -> bull put spread, DOWN -> bear call spread
    take_profit_pct: 50           # of the credit (SPEC 50-70%)
    stop_mult: 2.0                # close when the cost to close reaches 2x the credit
    exit_on_short_touch: true
    defend_within_pct: 0.5        # confirmed setup toward a short strike this close -> exit
    exit_time: "15:00"            # on the trading day before expiry
    max_per_day: 1
    hold_block_categories: [RBI_MPC, UNION_BUDGET, ELECTION_EXIT_POLL]  # none before the exit
    hold_earnings_weight_pct: 10  # results of this much index weight before the exit blocks
    weekend_book_pct: 80          # owner 13 Nov: before a weekend/holiday, book at >= 80% of target...
    weekend_book_time: "15:10"    # ...from this time
    side_stop_mult: 2.2           # owner 13 Nov: close if either side costs >= 2.2x its credit to close
    untested_decay_pct: 85        # SPEC 5.1: book the untested side at 85% decay while the other is tested (1 adjustment)
    first_candle_end: "09:30"     # SPEC 5.1: no stop exits in the first 15-min candle (gap rule); time exit still applies
  debit:                          # debit spreads on confirmed setups (HYPOTHESIS; paper)
    enabled: true
    underlyings: [NIFTY, SENSEX]
    min_score: 80
    first_entry: "09:30"
    last_entry: "14:00"
    width_steps: 2                # short leg 2 strikes out (Nifty 100 pts, Sensex 200)
    target_pct_of_max: 60         # exit when the spread is worth debit + 60% of the rest
    stop_pct_of_debit: 50         # exit when it is worth half of what was paid
    square_off: "15:20"
    max_entries_per_day: 2
  gamma:                          # SPEC 5.10 expiry-afternoon gamma breakout (HYPOTHESIS; paper)
    enabled: true
    underlyings: [NIFTY, SENSEX]
    morning_end: "13:30"
    first_entry: "13:45"
    last_entry: "14:30"           # SPEC 15:15 -> 14:30: settlement averages 15:00-15:30
    compression_pct: 0.45
    vol_mult: 1.8
    stop_pct: 30
  user_pins_max: 3               # contracts the page may add to the 50-key live feed
  readings_until: "15:15"         # no new readings/setups after this (normal days)
  readings_until_expiry_day: "14:45"  # ...or after this for an index expiring today
  reading_min_abs_delta: 0.15     # options outside 0.15-0.85 |delta| carry no reading
  reading_max_abs_delta: 0.85
  reading_min_time_value_pct: 5   # options with < 5% time value are settlement-locked
  expiry_day_last_entry: "14:30"  # long options expiring today: no entries after this
  expiry_day_exit: "14:45"        # ...and closed at this time (breaking_retail.md: 14:45)
  paper_max_lots: 2               # owner 12 Nov: paper strategies may use 2 lots within limits
  # 13 Nov review (owner approved batch 1). HYPOTHESIS values:
  stop_hold_max_s: 5              # a model-price stop hold gives way after this long...
  stop_override_mult: 1.5         # ...or past this x the stop distance, or at the per-trade limit
  paper_fill_latency_ms: 200      # paper orders fill against the book this long after the decision
  paper_leg_gap_ms: 300           # multi-leg orders: one leg at a time, this far apart, wings first
  credit_charges_mult: 3          # credit spreads: take-profit >= this x round-trip charges
  paper_margin_cap_pct: 100       # owner 13 Nov: each strategy's own broker margin <= 100% of
                                  # capital (Rs 2L), never blocked by another strategy (live: 50%)
  spread_expiry_exit: "15:00"     # short legs expiring today closed before the 15:10 settlement window
  gate2_mode: volatility          # 13 Nov (owner's gate2 notes): ATR-aware stop/half-risk/lock/trail;
                                  # "charges" = the 12 Nov 2x/3x-breakeven ratchet (a variant)
  manual_default_stop_pct: 25     # Track C ticket default; editable on the page
  key_file: data/state/cockpit.key   # engine<->gateway shared secret, created on first use
  journal_dir: data/state          # paper_bot.jsonl, paper_manual.jsonl
  replay_dir: data/replay

risk:                    # APPROVED (owner, 11 Nov 2026)
  per_trade_max_loss_pct:
    directional: 2.5     # SPEC §6: ≤ 2–3% of capital
    defined_risk_spread: 5.0  # SPEC §6: ≤ 5%
  daily_loss_limit_pct: 2.0
  weekly_loss_limit_pct: 5.0
  max_open_risk_pct: 10.0
  max_lots_per_strategy: 1  # until 20–30 live trades are logged
  max_trades_per_day: 5
  cooloff_after_loss_min: 15
  block_first_minutes: 15          # except ORB strategy
  directional_no_entry_after: "14:00"
  stock_fno_expiry_exit_days_before: 2   # SPEC §6 default E-2
  margin_headroom_max_used_pct: 50.0     # used + proposed margin <= 50% of capital
  loss_streak_size_cut_after: 3          # x0.5 size after this many losses in a session
  loss_streak_halt_after: 4              # no new entries for the day after this many

execution:
  live_enabled: false    # never flip without owner confirmation in-session
  broker: paper
  allowed_order_types: [LIMIT, MARKET_PROTECTED]   # plain MARKET is forbidden
  max_orders_per_second: 5         # hard cap; must stay < 10 (SEBI retail-algo threshold)
  reconcile_interval_s: 45         # 30–60 s
  disconnect_kill_after_s: 10      # APPROVED (11 Nov 2026): freezes new entries + alerts when quotes are missing (never panic-flattens without quotes)
  order_timeout_s: 10              # APPROVED (11 Nov 2026)

event_arb:              # Addendum A — APPROVED sleeve rules (11 Nov 2026); information only, never trades
  capital_inr: 100000           # sleeve for event arb (counts against account capital)
  max_holding_value_inr: 150000 # buffer under the ₹2L small-shareholder test
  risk_budget_pct_of_account: 3.0   # max loss at pessimistic acceptance + worst drop
  worst_case_drop_pct: 15
  participations: [0.4, 0.6, 1.0]
  optimistic_holdings_factor: 0.5
  drops_pct: [5, 10, 15]
  assumed_acceptances: []       # e.g. [0.05, 0.10] when no data — shown as assumptions
  broker: zerodha
  events_file: config/event_arb/events.yaml
  candidates_file: data/event_arb/candidates.jsonl
  state_file: data/event_arb/alert_state.json
  report_dir: reports/event_arb
  flags:
    small_buyback_pct: 3
    runup_amber_pct: 8
    near_52w_high_pct: 5
    min_avg_daily_value_inr: 5000000
    cushion_amber_pct: 3
    cushion_red_pct: 1
    stale_price_trading_days: 3
    ofs_discount_alert_pct: 5
    re_gap_alert_pct: 5
    rights_cushion_amber_pct: 10

recorder:                # M2 — what to record and how (SPEC §3 L1); not risk settings
  # Broker caps on concurrently subscribed symbols, per user (checked 10–11 Nov 2026):
  # Upstox V3 `full` mode (5-level depth, OI) 2,000 keys when it is the only mode used, and
  # `full_d30` (Upstox Plus) 50; Fyers Standard (free) 100, Prime 5,000.
  # Owner chose Upstox (free) on 11 Nov 2026; no paid API is in use.
  symbol_caps: {upstox: 2000, upstox_d30: 50, fyers: 100, dhan: 5000, zerodha: 3000, sim: 5000}
  depth_counts_separately: {fyers: true, upstox: false, upstox_d30: false, dhan: false}
  budget_margin: 2
  master:                     # broker defaults to data.primary (symbols are broker keys)
    segments:
      upstox: [NSE, BSE]
      fyers: [NSE_FO, NSE_CM, BSE_FO, BSE_CM]
  sessions: [[NSE, fo], [BSE, fo], [NSE, cm]]   # first one drives gap/watchdog/QC bounds
  pre_buffer_min: 10
  post_buffer_min: 5
  snapshot_interval_s: 60
  tick_windows: [["09:00", "09:35"]]   # every message for every contract (opening study)
  record_all_ticks: false
  gap_threshold_s: 5          # M2 acceptance: no feed gap > 5 s in session
  watchdog_silence_s: 20      # restart the feed after this much silence in session
  flush_interval_s: 30
  recenter_interval_s: 60
  master_refresh_min: 30      # re-download the contract file intraday for newly listed strikes
  stale_quote_s: 120
  lag_warn_s: 5
  clock_ahead_tolerance_s: 1
  depth: true
  vix_symbol: {upstox: "NSE_INDEX|India VIX", fyers: "NSE:INDIAVIX-INDEX"}
  extra_symbols: []           # any further broker keys to record all day
  constituents:               # SPEC L9: heavyweights' prices for index dispersion and breadth
    index: NIFTY
    top_n: 8                  # largest by weight (weights UNVERIFIED until checked)
    file: config/reference/nifty50_constituents.csv
  band:
    min_strikes_each_side: 25 # QC requirement (SPEC: max(±25 strikes, ±3σ))
    buffer_strikes: 2         # selected beyond the minimum so drift between re-centres keeps ±25
    sigma_mult: 3.0
    fallback_iv: 0.15         # band width only, before India VIX arrives
    tick_strikes_each_side: 10
    tick_expiry_roles: [current_weekly]
  underlyings:                # spot keys per broker
    - name: NIFTY
      spot: {upstox: "NSE_INDEX|Nifty 50", fyers: "NSE:NIFTY50-INDEX"}
      expiries: [current_weekly, next_weekly, current_monthly, next_monthly]   # next_monthly: the calendar's far leg (owner notes, spec C)
      weights: {current_weekly: 1.0, next_weekly: 1.5, current_monthly: 2.0, next_monthly: 2.5}
      futures_months: 1
    - name: SENSEX
      spot: {upstox: "BSE_INDEX|SENSEX", fyers: "BSE:SENSEX-INDEX"}
      expiries: [current_weekly]
      weights: {current_weekly: 2.0}
      futures_months: 1
  sticky_file: data/state/recorder_sticky.json
  qc_dir: reports/qc

shadow_live:             # V1 live shadow scanner (watch-only) on Upstox Plus full_d30
  # 30-level depth, at most 50 keys per connection (Upstox Plus; free to switch to, ₹30/order
  # only if you trade on Upstox). Runs alongside the recorder on a second connection
  # (Upstox allows 2 normally, 5 on Plus). Every depth message is recorded to `depth30`.
  max_symbols: 50
  include_vix: true
  recenter_interval_s: 300   # re-pick strikes around ATM every 5 minutes
  dashboard_interval_s: 60
  oi_wall_refresh_s: 60      # OI walls from the recorder's chain snapshots
  opening_range_min: 15
  alert_grades: [A_PLUS]     # Telegram alerts (SEND=1) are labelled HYPOTHESIS
  max_alerts_per_day: 10
  alert_cooldown_min: 15     # one alert per signal episode (symbol, direction, setup)
  watch:                     # 2 spots + VIX + 2 futures + 30 Nifty + 10 Sensex options = 45
    - {name: NIFTY, futures_months: 1, option_strikes_each_side: 7, expiry: current_weekly}
    - {name: SENSEX, futures_months: 1, option_strikes_each_side: 2, expiry: current_weekly}
  delivery_watch:            # optional group: F&O stocks with an EOD delivery spike
    enabled: true            # written by `tasks.py evening` (after ~19:30 IST); none = no stocks
    dir: data/state/delivery_watchlist
    max_symbols: 5           # 45 index keys above + 5 stocks = the 50-key full_d30 cap; stocks
                             # come before the farthest options if the index list grows
    max_age_days: 5          # ignore a watchlist older than this (calendar days)
    biases: [LONG_ACCUMULATION, RETAIL_CHURN_FADE]   # priority order (feeds VWAP_DELIVERY_RECLAIM)
    feed_mode: full_d30      # or `full` (5 levels) if `upstox-probe D30=1` shows NSE_EQ gets no
                             # 30-level book; the 50-key cap still counts them (one socket)
    bias_in_score: false     # owner: spikes pick what to WATCH, not what to trade, until the
                             # event study (engine/research/delivery_event_study.py) supports it
    spike:                   # HYPOTHESIS (untested): EOD delivery-spike classification
      min_delivery_qty_mult: 2.0          # delivery qty vs its 20-session average
      min_accumulation_return_pct: 1.0    # close-to-close move for accumulation/distribution
      min_churn_spike_pct: 5.0            # up-move for a retail-churn day
      max_churn_rel_delivery_ratio: 0.75  # delivery % below this x its 20-session average
    option_liquidity:        # HYPOTHESIS: a stock joins the watchlist only if its options trade
      strikes_each_side: 2   # near-ATM band (calls + puts summed)
      min_contracts: 1000    # traded on the trade date, nearest expiry >= min_days_to_expiry
      min_oi_contracts: 500  # open interest in contracts (NSE's file gives shares)
      min_days_to_expiry: 5  # stock options settle physically (SPEC §6 E-2)

swing:                     # SPEC §5.8 nightly swing scanner. HYPOTHESIS values, PAPER ONLY
  lookback: 60               # sessions searched for multi-touch levels
  min_touches: 2             # SPEC: touched >= 2-3 times
  touch_tol_pct: 0.75        # pivots within this % are one level
  clear_pct: 0.5             # "clearly" through the level
  vol_mult: 1.5              # SPEC: 1.5-2x average volume
  coil_filter: false         # SPEC: optional tight-range filter
  iv_rank_low: 50            # IV rank <= this -> ATM option, else cash
  min_option_days: 5         # SPEC: >= 5 trading days to expiry
  option_premium_stop_pct: 25   # SPEC: line stop capped at 20-25% of premium
  time_stop_sessions: 2      # SPEC
  cash_stop_pct: 6           # SPEC: 5-7%
  max_hold_sessions: 15
  option_max_premium_pct: 2.5   # premium = max loss; = risk.per_trade_max_loss_pct.directional
  cash_risk_pct: 2.5
  max_cash_value_pct: 25     # one cash position <= 25% of capital
  results_buffer_days: 10    # no long option when results fall inside this window
  min_turnover_cr: 10        # average daily traded value, ₹ crore

swing_paper:                 # EOD paper fills (no depth recorded for stocks): HYPOTHESIS spreads
  cash_half_spread_pct: 0.05
  option_half_spread_pct: 1.5

trend:                       # SPEC §5.6 trend sleeve via NIFTYBEES (no futures below ~₹15L)
  enabled: true              # PAPER ONLY; monthly 12-month momentum vs the 91-day T-bill
  allocation_pct: 20         # HYPOTHESIS: owner to set
  disaster_stop_pct: 10      # HYPOTHESIS: also the risk counted for the per-trade gate

fundamentals:              # equity pillar from exchange filings (tasks.py evening / fundamentals)
  index: NIFTY
  constituents_file: config/reference/nifty50_constituents.csv
  heavyweights_top_n: 10   # results/holdings refreshed for these + the delivery watchlist
  periods: 5               # latest quarters kept per company (YoY needs 5)
  pace_s: 1.0              # pause between NSE requests
  board_meeting_days: 45   # look-ahead for results dates -> config/events/macro_calendar.csv

backup:                   # nightly, end of `tasks.py evening` (owner delegated 13 Nov 2026)
  enabled: true
  target: "C:/QuantBackup"  # other partition of the same disk: guards deletion/corruption only.
                            # Point at an external drive (e.g. "E:/QuantBackup") for disk failure.
  sources: [data/parquet, data/state]   # what cannot be re-downloaded; data/raw is skipped
  min_free_gb: 5            # warn when the source or target drive has less free space

paths:
  data: data
  raw: data/raw
  parquet: data/parquet
  duckdb: data/duckdb
  private: data/private            # reference trade logs; gitignored
  logs: logs
  rules: config/rules

logging:
  config: ops/logging.yaml
